# Dependabot keeps this repo's pinned dependencies current.
#
# There is no Python manifest here on purpose: dispatcher/, mcp/ and tools/ are
# stdlib-only, so pip has nothing to watch. What does drift is the pinned
# third-party GitHub Actions in .github/workflows and the providers in
# infra/*.tf, and both are exactly the kind of supply-chain surface that goes
# stale silently. Add a `pip` entry here the day a requirements.txt appears.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    # A new release is at its most dangerous the day it ships: a compromised or
    # yanked version is usually caught within days, and Dependabot would
    # otherwise open the PR within hours. The counterpart to pinning by SHA --
    # pinning stops a tag moving under us, the cooldown stops us racing to
    # adopt whatever moved.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: "/infra"
    # A new release is at its most dangerous the day it ships: a compromised or
    # yanked version is usually caught within days, and Dependabot would
    # otherwise open the PR within hours. The counterpart to pinning by SHA --
    # pinning stops a tag moving under us, the cooldown stops us racing to
    # adopt whatever moved.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    schedule:
      interval: weekly
    open-pull-requests-limit: 5
